# State-native labels per canonical value, plus `en`: an English clause
# (subject "the accused") used in narratives and TG's free-text MO column.
#
# Labels are one-to-one within a field per state, so a normaliser adapter can
# invert them. A state needs labels only for columns its feed actually has.
# Tag fields carry `none_observed`: what a state writes for an empty tag set,
# which is different from a blank (missing) cell.

crime_type:
  BURGLARY_RESIDENTIAL: {MH: "HOUSE BREAKING", MP: GRIH_BHEDAN, KA: "Burglary - Dwelling", TG: "HB - Residential", en: "house burglary"}
  BURGLARY_COMMERCIAL:  {MH: "SHOP BREAKING", MP: DUKAN_BHEDAN, KA: "Burglary - Commercial", TG: "HB - Commercial", en: "break-in at commercial premises"}
  VEHICLE_THEFT:        {MH: "MOTOR VEHICLE THEFT", MP: VAHAN_CHORI, KA: "Theft - Vehicle", TG: "MV Theft", en: "vehicle theft"}
  SNATCHING:            {MH: "CHAIN SNATCHING", MP: CHAIN_JHAPATNA, KA: "Theft - Chain Snatching", TG: "Chain Snatching", en: "chain snatching"}
  ATM_TAMPERING:        {MH: "ATM TAMPERING", MP: ATM_CHHEDCHHAD, KA: "Cheating - ATM", TG: "ATM Offence", en: "ATM tampering"}


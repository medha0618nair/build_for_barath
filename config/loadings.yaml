      onsite_branch: {stealth: 0.0, planned: 0.0, group: 0.0, why: "reference"}
      offsite_kiosk: {stealth: 0.3, planned: 0.5, group: 0.0, why: "Unguarded kiosks are chosen deliberately."}
      white_label:   {stealth: 0.3, planned: 0.5, group: 0.0, why: "As offsite_kiosk."}
    attack_method:
      skimmer:          {stealth: 0.0, planned: 0.0, group: 0.0, why: "reference (the quiet end)"}
      cash_trap:        {stealth: 0.0, planned: 0.0, group: 0.0}
      gas_cutting:      {stealth: -1.5, planned: 0.5, group: 1.0, why: "Noisy, equipment-heavy, needs lookouts."}
      physical_forcing: {stealth: -1.5, planned: -0.5, group: 0.5, why: "Crude, fast and loud."}
      explosive:        {stealth: -2.0, planned: 1.5, group: 1.5, why: "Procurement and a crew."}
    alarm_defeated:

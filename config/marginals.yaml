# Population marginals p — the STYLE-NEUTRAL distribution.
#
# This is what an offender at style s = 0 produces. It is NOT what the
# corpus will show: averaging style-tilted distributions over offenders
# drifts away from p (Jensen; rare, heavily-loaded values drift most). The
# manifest records realised marginals. Present those, never these.
#
# Categorical fields: `p`, sums to 1. Tag fields (tools, property_taken):
# `rate`, one independent probability per tag. 0 and 1 are structural (e.g.
# vehicle theft always takes a vehicle) and stay fixed under style tilting.
#
# Burglary numbers match the TECHNICAL_SPEC.md §4.3 worked example and the
# TASK_DATA_GENERATION.md drift table. Everything else is a placeholder.
#
# PROVENANCE — filled by Claude at Nithin's request; all are `assumption`
# until someone sources them. One per field:
#   tag:    published   a citable table (put the citation in detail)
#           derived     computed from published figures (show the step)
#           assumption  judgement call (say what it rests on)
#   detail: free text
# `python -m linkage.config` lists every provenance still null.

crime_types:
